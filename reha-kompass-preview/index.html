<!doctype html><html lang=de><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Olafs Reha-Kompass</title><style>:root{--b:#071522;--b2:#0d2940;--g:#d3ad5f;--t:#eef2f6;--m:#aeb9c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#17466b66,transparent 35rem),var(--b);color:var(--t);font:15px Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.bar{position:sticky;top:0;z-index:8;background:#071522e8;backdrop-filter:blur(18px);border-bottom:1px solid #d3ad5f66;padding:15px 4vw;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand small{display:block;color:var(--g);letter-spacing:.13em;text-transform:uppercase;font-size:9px;margin-top:3px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.pill{border:1px solid #d3ad5f55;background:#ffffff08;color:var(--t);border-radius:999px;padding:9px 12px;cursor:pointer}.nav button.on,.pill.gold{background:linear-gradient(135deg,#b68b3e,#efd38f);color:#071522;font-weight:800}main{max-width:1180px;margin:auto;padding:18px 4vw 110px}.hero{min-height:390px;border:1.5px solid #d3ad5f99;border-radius:32px;padding:clamp(28px,6vw,70px);display:grid;grid-template-columns:1.5fr .7fr;gap:30px;align-items:end;background:linear-gradient(145deg,#17496f77,#071522 65%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--g),transparent)}.hero h1{font-size:clamp(42px,7vw,78px);line-height:.98;letter-spacing:-.05em;margin:12px 0 18px}.hero p,.muted{color:var(--m);line-height:1.65}.side{border:1px solid #d3ad5f66;border-radius:23px;padding:22px;background:#07152299}.ey{color:#efd38f;text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:.18em}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:20px}.card{grid-column:span 4;border:1px solid #d3ad5f44;border-radius:24px;padding:22px;background:linear-gradient(145deg,#ffffff0c,#ffffff04)}.wide{grid-column:span 8}.full{grid-column:1/-1}.card h2,.card h3{margin:0 0 10px}.task,.item{display:flex;gap:12px;padding:14px;margin-top:10px;border:1px solid #d3ad5f33;border-radius:16px;background:#0002;cursor:pointer}.check{width:23px;height:23px;border:1px solid var(--g);border-radius:50%;flex:none}.done{opacity:.55}.done .check{background:var(--g)}.done .check:after{content:'✓';color:#071522;font-weight:900;display:grid;place-items:center}.coach{border:1.5px solid #d3ad5f99;border-radius:22px;padding:22px;background:linear-gradient(145deg,#d3ad5f18,#0d2940cc)}.msg{font-size:21px;line-height:1.5;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{padding:15px;border:1px solid #d3ad5f33;border-radius:16px}.metric b{display:block;color:#efd38f;font-size:27px}input,textarea,select{width:100%;padding:12px;border:1px solid #d3ad5f55;border-radius:13px;background:#061522;color:white;margin-top:8px}textarea{min-height:110px}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:end;justify-content:center;padding:16px}.modal.on{display:flex}.sheet{width:min(620px,100%);background:#0b2236;border:1.5px solid #d3ad5f99;border-radius:26px;padding:24px}.bottom{display:none;position:fixed;bottom:10px;left:12px;right:12px;z-index:10;background:#071522ee;border:1px solid #d3ad5f66;border-radius:22px;padding:7px}.bottom button{flex:1;border:0;background:transparent;color:var(--m);padding:9px 4px;font-size:10px}.bottom button.on{color:#efd38f}@media(max-width:820px){.nav{display:none}.bottom{display:flex}.hero{grid-template-columns:1fr;min-height:520px}.card,.wide{grid-column:span 6}}@media(max-width:600px){main{padding:12px 13px 100px}.hero{padding:28px 20px;border-radius:27px}.hero h1{font-size:48px}.card,.wide,.full{grid-column:1/-1}.metric{grid-template-columns:1fr}.bar{padding:12px 15px}}</style><body><header class=bar><div class=brand>Olafs Reha-Kompass<small>Dein persönlicher Bereich</small></div><nav class=nav id=topnav></nav></header><main id=main></main><nav class=bottom id=bottom></nav><div class=modal id=modal><div class=sheet id=sheet></div></div><script>const tabs=['Heute','Plan','Checklisten','Tagebuch','Coach','Mehr'],K='olaf-reha-v3';let s=JSON.parse(localStorage.getItem(K)||'null')||{tasks:[['Unterlagen eingereicht',1,'Vorbereitung'],['Aufnahmetermin eintragen',0,'Vorbereitung'],['Medikamentenplan einpacken',0,'Packliste'],['Ladegeräte und Powerbank',0,'Packliste'],['Hygieneartikel auffüllen',0,'Einkäufe'],['Arztberichte zusammenstellen',0,'Dokumente']],events:[['Rückmeldung Aufnahmetermin','2026-07-17','']],journal:[]};let tab='Heute';const save=()=>{localStorage.setItem(K,JSON.stringify(s));render()};const esc=x=>(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nav(){topnav.innerHTML=bottom.innerHTML='';tabs.forEach(x=>{for(const n of[topnav,bottom]){let b=document.createElement('button');b.textContent=x;b.className=x==tab?'on':'';b.onclick=()=>{tab=x;render()};n.append(b)}})}function hero(n,title,p,side){return `<section class=hero><div><span class=ey>${n}</span><h1>${title}</h1><p>${p}</p></div><aside class=side>${side}</aside></section>`}function taskHTML(filter=''){return s.tasks.map((t,i)=>!filter||t[2]==filter?`<div class="task ${t[1]?'done':''}" onclick="toggle(${i})"><span class=check></span><div><b>${esc(t[0])}</b><div class=muted>${t[2]}</div></div></div>`:'').join('')}window.toggle=i=>{s.tasks[i][1]=!s.tasks[i][1];save()};function openSheet(h){sheet.innerHTML=h;modal.classList.add('on')}modal.onclick=e=>{if(e.target==modal)modal.classList.remove('on')};function render(){nav();let open=s.tasks.filter(x=>!x[1]).length,p=Math.round(s.tasks.filter(x=>x[1]).length/s.tasks.length*100),h='';if(tab=='Heute')h=hero('01 · Dein Tag','Olaf, heute zählt nur der nächste gute Schritt.','Deine App begrüßt dich persönlich, bündelt Aufgaben und gibt dir Motivation, ohne dich zu überfordern.',`<span class=ey>Dein Fokus</span><h2>Aufnahmetermin noch offen</h2><p class=muted>Danach ordnet sich alles automatisch.</p>`)+`<div class=grid><article class="card wide"><span class=ey>Heute wichtig</span>${taskHTML()}</article><article class=card><span class=ey>Fortschritt</span><div class=metric><div><b>${open}</b>offen</div><div><b>${p}%</b>erledigt</div><div><b>${s.journal.length}</b>Berichte</div></div></article><article class="card full"><div class=coach><span class=ey>Reha-Kompass an Olaf</span><div class=msg id=cm>Du musst heute nicht alles schaffen. Eine klare Aufgabe reicht.</div><div class=row><button class="pill gold" onclick="coach('mot')">Motivation</button><button class=pill onclick="coach('stress')">Ich bin überfordert</button><button class=pill onclick="coach('next')">Was ist als Nächstes dran?</button></div></div></article></div>`;if(tab=='Plan')h=hero('02 · Orientierung','Dein Reha-Plan passt sich dir an.','Termine, Therapiezeiten, Arztgespräche und Erholung werden verständlich angeordnet.',`<button class="pill gold" onclick="eventForm()">Termin hinzufügen</button>`)+`<div class=grid><article class="card wide"><span class=ey>Termine</span>${s.events.map(e=>`<div class=item><div><b>${esc(e[0])}</b><div class=muted>${e[1]} ${e[2]||''}</div></div></div>`).join('')}</article><article class=card><span class=ey>Therapieplan</span><h3>Foto oder PDF auswählen</h3><p class=muted>Die echte KI-Erkennung folgt in der geschützten Version.</p><input type=file accept="image/*,.pdf"></article></div>`;if(tab=='Checklisten')h=hero('03 · Vorbereitung','Alles, was du brauchst – ohne Chaos.','Vorbereitung, Packliste, Einkäufe und Dokumente sind vollständig abhakbar.',`<h2>${p}% erledigt</h2><button class="pill gold" onclick="taskForm()">Punkt hinzufügen</button>`)+`<div class=grid>${['Vorbereitung','Packliste','Einkäufe','Dokumente'].map(c=>`<article class="card wide"><span class=ey>${c}</span>${taskHTML(c)}</article>`).join('')}</div>`;if(tab=='Tagebuch')h=hero('04 · Reflexion','Dein Tag darf ehrlich und einfach sein.','Stimmung, Schlaf, Schmerzen, Appetit und Gedanken finden in wenigen Minuten Platz.',`<button class="pill gold" onclick="journalForm()">Bericht schreiben</button>`)+`<div class=grid><article class="card full"><span class=ey>Berichte</span>${s.journal.length?s.journal.slice().reverse().map(j=>`<div class=item><div><b>${j.date} · Stimmung ${j.mood}/10</b><div class=muted>${esc(j.text)}</div></div></div>`).join(''):'<p class=muted>Noch kein Bericht gespeichert.</p>'}</article></div>`;if(tab=='Coach')h=hero('05 · Dein Coach','Olaf, du musst die Reha nicht allein organisieren.','Motivation und konkrete Strategien helfen bei Überforderung, Schlaf, Heimweh und schwierigen Gesprächen.',`<span class=ey>Persönlicher Impuls</span><h2>Ein Schritt nach dem anderen</h2>`)+`<div class=grid><article class="card full"><div class=coach><div class=msg id=cm>Olaf, wobei brauchst du gerade Unterstützung?</div><div class=row><button class=pill onclick="coach('mot')">Motivation</button><button class=pill onclick="coach('stress')">Überforderung</button><button class=pill onclick="coach('home')">Heimweh</button><button class=pill onclick="coach('sleep')">Schlaf</button><button class=pill onclick="coach('talk')">Gespräch vorbereiten</button></div></div></article><article class=card><span class=ey>Strategie</span><h3>Wenn alles zu viel wird</h3><p class=muted>Nur den nächsten Termin ansehen. Fünf Minuten ruhig atmen. Eine Person informieren. Danach neu entscheiden.</p></article><article class=card><span class=ey>Insiderwissen</span><h3>Pausen schützen</h3><p class=muted>Therapiefreie Zeit nicht vollständig mit Organisation füllen. Fragen vorher notieren und belastende Gespräche kurz vorbereiten.</p></article></div>`;if(tab=='Mehr')h=hero('06 · Dein Bereich','Dokumente, Wissen und Einstellungen an einem Ort.','Später kommen geschützter Zugang, Synchronisation, automatische Therapieplan-Erkennung und Push hinzu.',`<span class=ey>Vorschau</span><h2>Lokal gespeichert</h2>`)+`<div class=grid><article class=card><h3>Dokumentencenter</h3><p class=muted>Bewilligung, Arztberichte, Medikamentenliste und Therapieplan.</p></article><article class=card><h3>Insiderwissen</h3><p class=muted>Alltag, Ruhezeiten, Gespräche, WLAN, Freizeit und Selbstfürsorge.</p></article><article class=card><h3>Push</h3><p class=muted>Folgt erst in der geschützten Online-Version.</p></article><article class="card full"><button class=pill onclick="resetAll()">Lokale Testdaten löschen</button></article></div>`;main.innerHTML=h}window.coach=t=>{let m={mot:'Olaf, du hast bereits wichtige Schritte geschafft. Heute reicht es, weiterzugehen.',stress:'Olaf, stopp kurz. Wähle genau eine Aufgabe. Alles andere darf warten.',next:'Als Nächstes zählt der bestätigte Aufnahmetermin. Danach ordnet die App alles neu.',home:'Heimweh ist kein Scheitern. Plane einen festen Kontakt und etwas Vertrautes für den Abend.',sleep:'Licht reduzieren, schwere Themen beenden und den ersten Termin für morgen bereitlegen.',talk:'Notiere drei Punkte: Was ist passiert? Was brauchst du? Was soll konkret vereinbart werden?'};document.querySelectorAll('#cm').forEach(x=>x.textContent=m[t])};window.eventForm=()=>openSheet(`<h2>Termin hinzufügen</h2><input id=et placeholder=Titel><input id=ed type=date><input id=ei type=time><button class="pill gold" onclick="addEvent()">Speichern</button>`);window.addEvent=()=>{if(et.value&&ed.value){s.events.push([et.value,ed.value,ei.value]);save();modal.classList.remove('on')}};window.taskForm=()=>openSheet(`<h2>Listenpunkt hinzufügen</h2><select id=tc><option>Vorbereitung</option><option>Packliste</option><option>Einkäufe</option><option>Dokumente</option></select><input id=tt placeholder=Aufgabe><button class="pill gold" onclick="addTask()">Hinzufügen</button>`);window.addTask=()=>{if(tt.value){s.tasks.push([tt.value,0,tc.value]);save();modal.classList.remove('on')}};window.journalForm=()=>openSheet(`<h2>Olafs Tagesbericht</h2><label>Stimmung 1–10<input id=jm type=number min=1 max=10 value=6></label><textarea id=jt placeholder='Was war heute wichtig?'></textarea><button class="pill gold" onclick="addJournal()">Speichern</button>`);window.addJournal=()=>{if(jt.value){s.journal.push({date:new Date().toLocaleDateString('de-DE'),mood:jm.value,text:jt.value});save();modal.classList.remove('on')}};window.resetAll=()=>{if(confirm('Olaf, wirklich alle lokalen Testdaten löschen?')){localStorage.removeItem(K);location.reload()}};render();</script></body></html>
