<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071522"><title>Olafs Reha-Kompass</title><style>html,body{margin:0;min-height:100%;background:#071522;color:#f6f1e8;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.ring{width:52px;height:52px;border:2px solid rgba(211,173,95,.25);border-top-color:#d3ad5f;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 18px}@keyframes s{to{transform:rotate(360deg)}}small{color:#aeb9c4}</style></head><body><div class="load"><div><div class="ring"></div><strong>Olafs Reha-Kompass wird geladen</strong><br><small>Dein persönlicher Reha-Bereich</small></div></div><script>(async()=>{try{const t=await (await fetch('./app-1.txt?v=2')).text();const b=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div><strong>Die Vorschau konnte nicht geladen werden.</strong><br><small>Bitte die Seite einmal neu laden.</small></div></div>'}})();</script></body></html>
